<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moda e Estilo</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>


    <header class="topo">
        <div class="logo">
            SEU ESTILO<span>.</span>
        </div>

        <p class="slogan">encontramos aqui sua melhor versão</p>

        <div class="sacola">
            🛍️
        </div>



        <nav class="menu">
            <a href="#inicio">Início</a>
            <a href="#categorias">Categorias</a>
            <a href="#produtos">Produtos</a>
        </nav>

    </header>
    <main>

        <section class="banner" id="inicio">
            <div class="banner-texto">
                <p>COLEÇÃO 2026</p>
                <h1>SEU ESTILO.<br>SUA ATITUDE.</h1>
                <a href="#produtos" class="botao">COMPRE AGORA</a>
            </div>
        </section>


        <section class="categorias" id="categorias">

            <h2>EXPLORE NOSSAS CATEGORIAS</h2>

            <div class="categoria-lista">

                <div class="categoria">
                    <img src="imagem/br-11134207-7r98o-lqm06bg9ql27ec.jpg" width="120" alt="Camisetas polo">
                    <h3>Camisetas</h3>
                </div>

                <div class="categoria">
                    <img src="imagem/17924411216e62b1482047f5eb95f932e6298e9802_thumbnail_900x.webp" width="120"
                        alt="Calças">
                    <h3>Calças</h3>
                </div>

                <div class="categoria">
                    <img src="imagem/51KM8tTidKL._AC_SX569_.jpg" width="120" alt="Jaquetas">
                    <h3>Jaquetas</h3>
                </div>

            </div>
        </section>


        <section class="produtos" id="produtos">

            <h2>DESTAQUES DA COLEÇÃO</h2>
            <p class="subtitulo">Encontre seu look!</p>

            <div class="produto-lista">

                <article class="card">
                    <img src="imagem/81ycf7EY23L._AC_SX569_.jpg" width="120" alt="Camiseta básica">
                    <div class="card-info">
                        <h3>Camiseta Básica</h3>
                        <p>R$ 59,90</p>
                        <button>COMPRAR</button>
                    </div>
                </article>


            </div>
        </section>
